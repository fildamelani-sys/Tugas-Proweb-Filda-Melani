<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Sederhana HTML</title>
  </head>
  <body>

    <table border="3">
      <tr>
        <th>
    <h1>KALKULATOR</h1>

    <div class="table1">
      <input type="number" id="bilangan1" placeholder="angka pertama" />
      <input
        type="number"
        id="bilangan2"
        placeholder="angka kedua"
      /><br /><br />

      <button onclick="tambah()">+</button>
      <button onclick="kurang()">-</button>
      <button onclick="kali()">*</button>
      <button onclick="bagi()">/</button><br /><br />

      

    <input type="text" id="hasil"/>

    <script>
      function tambah() {
        var a = document.getElementById("bilangan1").value;
        var b = document.getElementById("bilangan2").value;
        var hasil = Number(a) + Number(b);
        document.getElementById("hasil").value = hasil;
      }
      function kurang() {
        var a = document.getElementById("bilangan1").value;
        var b = document.getElementById("bilangan2").value;
        var hasil = Number(a) - Number(b);
        document.getElementById("hasil").value = hasil;
      }
      function kali() {
        var a = document.getElementById("bilangan1").value;
        var b = document.getElementById("bilangan2").value;
        var hasil = Number(a) * Number(b);
        document.getElementById("hasil").value = hasil;
      }
      function bagi() {
        var a = document.getElementById("bilangan1").value;
        var b = document.getElementById("bilangan2").value;
        if (Number(b) === 0) {
          document.getElementById("hasil").value = "error (tidak terdefinisi)";
        } else {
          var hasil = Number(a) / Number(b);
          document.getElementById("hasil").value = hasil;
        }
      }
    </script>
  </body>
</html>
